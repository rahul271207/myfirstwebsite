<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Admission Enquiry Form</title>
</head>
<body>

    <h1>College Admission Enquiry Form</h1>

    <form action="#" method="post" enctype="multipart/form-data">

        <fieldset>
            <legend>Personal Information</legend>

            <label for="fname">First Name *</label>
            <input type="text" id="fname" name="fname" placeholder="Rahul" required maxlength="30">

            <label for="lname">Last Name *</label>
            <input type="text" id="lname" name="lname" placeholder="Sharma" required maxlength="30">

            <label for="dob">Date of Birth *</label>
            <input type="date" id="dob" name="dob" min="1995-01-01" max="2010-12-31" required>

            <label>Gender *</label>
            <input type="radio" id="g1" name="gender" value="Male" required> Male
            <input type="radio" id="g2" name="gender" value="Female"> Female
            <input type="radio" id="g3" name="gender" value="Other"> Other

            <label for="category">Category</label>
            <select id="category" name="category">
                <option value="">-- Select --</option>
                <option>General</option>
                <option>OBC</option>
                <option>SC</option>
                <option>ST</option>
                <option>EWS</option>
            </select>

            <label for="aadhaar">Aadhaar / Student ID Number</label>
            <input type="text" id="aadhaar" name="aadhaar" pattern="[0-9]{12}" placeholder="12 digit number" title="Enter 12 digits">
        </fieldset>

        <fieldset>
            <legend>Contact Details</legend>

            <label for="email">Email Address *</label>
            <input type="email" id="email" name="email" placeholder="rahul@example.com" required>

            <label for="phone">Mobile Number *</label>
            <input type="tel" id="phone" name="phone" pattern="[6-9][0-9]{9}" placeholder="10 digit mobile number" required>

            <label for="altphone">Alternate Contact</label>
            <input type="tel" id="altphone" name="altphone">

            <label for="address">Address / City *</label>
            <textarea id="address" name="address" rows="4" cols="50" placeholder="House no, street, city, state, pincode" required></textarea>

            <label for="pincode">Pincode</label>
            <input type="text" id="pincode" name="pincode" pattern="[0-9]{6}" maxlength="6" size="6">
        </fieldset>

        <fieldset>
            <legend>Academic Background</legend>

            <label for="course">Course Applying For *</label>
            <select id="course" name="course" required>
                <option value="">-- Select Course --</option>
                <optgroup label="Engineering">
                    <option>B.Tech - Computer Engineering</option>
                    <option>B.Tech - Electronics &amp; Communication</option>
                    <option>B.Tech - Mechanical Engineering</option>
                </optgroup>
                <optgroup label="Diploma">
                    <option>Diploma in Computer Science</option>
                    <option>Diploma in Electronics</option>
                </optgroup>
                <option>B.Sc</option>
                <option>M.Tech</option>
            </select>

            <label for="board">Board / University</label>
            <input type="text" id="board" name="board" list="boards">
            <datalist id="boards">
                <option value="Maharashtra HSC">
                <option value="CBSE">
                <option value="ICSE">
                <option value="SPPU">
            </datalist>

            <label for="marks">10th Marks (%)</label>
            <input type="number" id="marks" name="marks" min="0" max="100" step="0.01" placeholder="e.g. 85.50">

            <label for="pcm">PCM / PCM Total</label>
            <input type="number" id="pcm" name="pcm" min="0" max="300" placeholder="e.g. 240">

            <label for="examdate">Preferred Entrance Exam Date</label>
            <input type="date" id="examdate" name="examdate">
        </fieldset>

        <fieldset>
            <legend>Campus Visit</legend>

            <label for="visitdate">Preferred Visit Date *</label>
            <input type="date" id="visitdate" name="visitdate" required>

            <label for="visittime">Preferred Visit Time *</label>
            <input type="time" id="visittime" name="visittime" value="10:00" required>

            <label>Transport Facility Required</label>
            <input type="checkbox" id="t1" name="transport" value="yes" checked> Yes, I need bus facility

            <label>Interests</label>
            <input type="checkbox" id="i1" name="interest" value="hostel"> Hostel
            <input type="checkbox" id="i2" name="interest" value="sports"> Sports
            <input type="checkbox" id="i3" name="interest" value="library"> Library &amp; Labs
            <input type="checkbox" id="i4" name="interest" value="placement"> Placement Cell
        </fieldset>

        <fieldset>
            <legend>Documents</legend>

            <label for="photo">Upload Passport Size Photo</label>
            <input type="file" id="photo" name="photo" accept="image/*">

            <label for="marksheet">Upload 10th Marksheet</label>
            <input type="file" id="marksheet" name="marksheet" accept=".pdf,.jpg,.png">
        </fieldset>

        <fieldset>
            <legend>Login Details (for this demo)</legend>

            <label for="user">User ID</label>
            <input type="text" id="user" name="user" pattern="[A-Za-z0-9_]{4,10}" title="4 to 10 letters/numbers/underscore">

            <label for="pass">Password</label>
            <input type="password" id="pass" name="pass" minlength="6" placeholder="Minimum 6 characters">

            <label for="confirm">Confirm Password</label>
            <input type="password" id="confirm" name="confirm" minlength="6">
        </fieldset>

        <p>
            <input type="checkbox" id="agree" name="agree" value="yes" required>
            I agree to the college privacy policy and consent to be contacted.
        </p>

        <input type="hidden" name="formToken" value="abc123xyz">

        <p>
            <input type="submit" value="Submit Enquiry">
            <input type="reset" value="Reset Form">
        </p>

    </form>

</body>
</html>
