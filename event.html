<!DOCTYPE html>
<html>
<head>
    <title>College Event Registration Form</title>
</head>
<body style="background-color:lightgray; font-family:Arial;">

    <h1 style="text-align:center;">College Event Registration Form</h1>

    <form style="background-color:white; width:60%; margin:auto; padding:20px; border:1px solid black;">

        <label>Student Name:</label><br>
        <input type="text" placeholder="Enter your name"
        style="width:100%; padding:8px;"><br><br>

        <label>Roll Number:</label><br>
        <input type="number" placeholder="Enter roll number"
        style="width:100%; padding:8px;"><br><br>

        <label>Department:</label><br>
        <select style="width:100%; padding:8px;">
            <option>Select Department</option>
            <option>CSE</option>
            <option>CSE Cyber Security</option>
            <option>AI & DS</option>
            <option>IT</option>
            <option>ECE</option>
            <option>EEE</option>
            <option>Mechanical</option>
            <option>Civil</option>
        </select><br><br>

        <label>Year of Study:</label><br>
        <select style="width:100%; padding:8px;">
            <option>Select Year</option>
            <option>1st Year</option>
            <option>2nd Year</option>
            <option>3rd Year</option>
            <option>4th Year</option>
        </select><br><br>

        <label>Phone Number:</label><br>
        <input type="tel" placeholder="Enter phone number"
        style="width:100%; padding:8px;"><br><br>

        <label>Email Address:</label><br>
        <input type="email" placeholder="Enter email"
        style="width:100%; padding:8px;"><br><br>

        <label>Enter your password:</label><br>
        <input type="password" placeholder="Enter Password"
        style="width:100%; padding:8px;"><br><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <input type="radio" name="gender"> Other
        <br><br>

        <label>Event Name:</label><br>
        <input type="text" placeholder="Enter event name"
        style="width:100%; padding:8px;"><br><br>

        <label>Why did you choose this event?</label><br>
        <textarea rows="4" cols="50"
        style="width:100%; padding:8px;"></textarea><br><br>

        <label>What do you expect to learn?</label><br>
        <textarea rows="4" cols="50"
        style="width:100%; padding:8px;"></textarea><br><br>

        <label>Emergency Contact Number:</label><br>
        <input type="tel" placeholder="Emergency contact"
        style="width:100%; padding:8px;"><br><br>

         <label>Upload Your ID Card</label><br>
        <input type="file" placeholder="Upload id card"
        style="width:100%; padding:8px;"><br><br>

         <label>Choose date of submission</label><br>
        <input type="date" placeholder="date"
        style="width:100%; padding:8px;"><br><br>

        <input type="checkbox"> I confirm that the information provided is correct.
        <br><br>

        <input type="submit" value="Register"
        style="background-color:blue; color:white; padding:10px 20px; border:none;">

        <input type="reset" value="Reset"
        style="background-color:red; color:white; padding:10px 20px; border:none;">

    </form>

</body>
</html>
