<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>College Admission Enquiry Form</title>
        <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px 15px;
        }
        .container {
            max-width: 700px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(0,0,0,.1);
        }
        h2 { text-align: center; color: #1f3a5f; margin-top: 0; }
        fieldset {
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 20px;
            padding: 15px 20px 20px;
        }
        legend { font-weight: bold; color: #1f3a5f; padding: 0 8px; }
        label { display: block; margin: 10px 0 5px; font-weight: 600; }
        input[type=text], input[type=email], input[type=tel], input[type=date],
        input[type=number], input[type=password], input[type=time], select, textarea {
            width: 100%;
            padding: 9px;
            border: 1px solid #bbb;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea { resize: vertical; min-height: 80px; }
        .inline { display: inline-block; width: auto; margin-right: 8px; }
        .check { display: flex; align-items: center; margin: 8px 0; font-weight: normal; }
        .check input { margin-right: 8px; }
        .row { display: flex; gap: 15px; }
        .row > div { flex: 1; }
        fieldset[disabled] { opacity: .55; }
        .btn {
            background: #1f3a5f; color: #fff; border: none;
            padding: 11px 22px; margin-right: 10px; border-radius: 4px;
            font-size: 15px; cursor: pointer;
        }
        .btn:hover { background: #2c5282; }
        .btn-secondary { background: #6c757d; }
        .out { margin-top: 15px; font-weight: bold; color: #155724; }
    </style>
    </head>
    <body>
        <div class="container">
            <h2>College Admission Enquiry Form</h2>

            <form id="enquiryForm" action="#" method="post"
                enctype="multipart/form-data">

                <fieldset>
                    <legend>Personal Information</legend>

                    <div class="row">
                        <div>
                            <label for="fname">First Name *</label>
                            <input type="text" id="fname" name="fname"
                                placeholder="Rahul" required maxlength="30">
                        </div>
                        <div>
                            <label for="lname">Last Name *</label>
                            <input type="text" id="lname" name="lname"
                                placeholder="Sharma" required maxlength="30">
                        </div>
                    </div>

                    <label for="dob">Date of Birth *</label>
                    <input type="date" id="dob" name="dob" min="1995-01-01"
                        max="2010-12-31" required>

                    <div class="row">
                        <div>
                            <label><input type="radio" name="gender"
                                    value="Male" class="inline" required>
                                Male</label>
                            <label><input type="radio" name="gender"
                                    value="Female" class="inline">
                                Female</label>
                            <label><input type="radio" name="gender"
                                    value="Other" class="inline"> Other</label>
                        </div>
                        <div>
                            <label for="category">Category</label>
                            <select id="category" name="category">
                                <option value>-- Select --</option>
                                <option>General</option>
                                <option>OBC</option>
                                <option>SC</option>
                                <option>ST</option>
                                <option>EWS</option>
                            </select>
                        </div>
                    </div>

                    <label for="aadhaar">Aadhaar / Student ID Number</label>
                    <input type="text" id="aadhaar" name="aadhaar"
                        pattern="[0-9]{12}" placeholder="12 digit number"
                        title="Enter 12 digits">
                </fieldset>

                <fieldset>
                    <legend>Contact Details</legend>

                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email"
                        placeholder="rahul@example.com" required>

                    <label for="phone">Mobile Number *</label>
                    <input type="tel" id="phone" name="phone"
                        pattern="[6-9][0-9]{9}"
                        placeholder="10 digit mobile number" required>

                    <label for="altphone">Alternate Contact</label>
                    <input type="tel" id="altphone" name="altphone">

                    <label for="address">Address / City *</label>
                    <textarea id="address" name="address"
                        placeholder="House no, street, city, state, pincode"
                        required></textarea>

                    <label for="pincode">Pincode</label>
                    <input type="text" id="pincode" name="pincode"
                        pattern="[0-9]{6}" maxlength="6" size="6">
                </fieldset>

                <fieldset>
                    <legend>Academic Background</legend>

                    <label for="course">Course Applying For *</label>
                    <select id="course" name="course" required>
                        <option value>-- Select Course --</option>
                        <optgroup label="Engineering">
                            <option>B.Tech - Computer Engineering</option>
                            <option>B.Tech - Electronics &amp;
                                Communication</option>
                            <option>B.Tech - Mechanical Engineering</option>
                        </optgroup>
                        <optgroup label="Diploma">
                            <option>Diploma in Computer Science</option>
                            <option>Diploma in Electronics</option>
                        </optgroup>
                        <option>B.Sc</option>
                        <option>M.Tech</option>
                    </select>

                    <label for="board">Board / University</label>
                    <input type="text" id="board" name="board" list="boards">
                    <datalist id="boards">
                        <option value="Maharashtra HSC">
                            <option value="CBSE">
                                <option value="ICSE">
                                    <option value="SPPU">
                                    </datalist>

                                    <div class="row">
                                        <div>
                                            <label for="marks">10th Marks
                                                (%)</label>
                                            <input type="number" id="marks"
                                                name="marks" min="0" max="100"
                                                step="0.01"
                                                placeholder="e.g. 85.50">
                                        </div>
                                        <div>
                                            <label for="pcm">PCM / PCM
                                                Total</label>
                                            <input type="number" id="pcm"
                                                name="pcm" min="0" max="300"
                                                placeholder="e.g. 240">
                                        </div>
                                    </div>

                                    <label for="examdate">Preferred Entrance
                                        Exam Date</label>
                                    <input type="date" id="examdate"
                                        name="examdate">
                                </fieldset>

                                <fieldset>
                                    <legend>Campus Visit</legend>

                                    <label for="visitdate">Preferred Visit Date
                                        &amp; Time *</label>
                                    <div class="row">
                                        <div>
                                            <input type="date" id="visitdate"
                                                name="visitdate" required>
                                        </div>
                                        <div>
                                            <input type="time" id="visittime"
                                                name="visittime" value="10:00"
                                                required>
                                        </div>
                                    </div>

                                    <label>Transport Facility Required</label>
                                    <label class="check"><input type="checkbox"
                                            name="transport" value="yes"
                                            checked> Yes, I need bus
                                        facility</label>

                                    <label>Interests</label>
                                    <label class="check"><input type="checkbox"
                                            name="interest" value="hostel">
                                        Hostel</label>
                                    <label class="check"><input type="checkbox"
                                            name="interest" value="sports">
                                        Sports</label>
                                    <label class="check"><input type="checkbox"
                                            name="interest" value="library">
                                        Library &amp; Labs</label>
                                    <label class="check"><input type="checkbox"
                                            name="interest" value="placement">
                                        Placement Cell</label>
                                </fieldset>

                                <fieldset>
                                    <legend>Documents</legend>
                                    <label for="photo">Upload Passport Size
                                        Photo</label>
                                    <input type="file" id="photo" name="photo"
                                        accept="image/*">
                                    <label for="marksheet">Upload 10th
                                        Marksheet</label>
                                    <input type="file" id="marksheet"
                                        name="marksheet"
                                        accept=".pdf,.jpg,.png">
                                </fieldset>

                                <fieldset>
                                    <legend>Login Details (for this
                                        demo)</legend>
                                    <label for="user">User ID</label>
                                    <input type="text" id="user" name="user"
                                        pattern="[A-Za-z0-9_]{4,10}"
                                        title="4 to 10 letters/numbers/underscore">
                                    <label for="pass">Password</label>
                                    <input type="password" id="pass" name="pass"
                                        minlength="6"
                                        placeholder="Minimum 6 characters">
                                    <label for="confirm">Confirm
                                        Password</label>
                                    <input type="password" id="confirm"
                                        name="confirm" minlength="6">
                                </fieldset>

                                <label class="check">
                                    <input type="checkbox" name="agree"
                                        required>
                                    I agree to the college privacy policy and
                                    consent to be contacted.
                                </label>

                                <input type="hidden" name="formToken"
                                    value="abc123xyz">
                                <input type="reset" value="Reset Form">

                                <p>
                                    <button type="submit" class="btn">Submit
                                        Enquiry</button>
                                    <button type="button"
                                        class="btn btn-secondary"
                                        onclick="preview()">Preview</button>
                                </p>
                            </form>

                            <p class="out" id="out"></p>
                        </div>

                        <script>
    function preview() {
        document.getElementById('out').textContent =
            "Enquiry recorded for: " + document.getElementById('fname').value + " " +
            document.getElementById('lname').value + " (" + document.getElementById('email').value + ")";
    }

    document.getElementById('enquiryForm').addEventListener('submit', function (e) {
        e.preventDefault();
        if (document.getElementById('pass').value !== document.getElementById('confirm').value) {
            alert("Passwords do not match!");
            return;
        }
        alert("Form submitted successfully!");
    });
</script>
                    </body>
                </html>
