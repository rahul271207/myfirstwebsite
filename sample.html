<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 40px;
      text-align: center;
    }
    h1 { color: #2c3e50; }
    p  { color: #555; font-size: 18px; }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background: #3498db;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover { background: #2980b9; }
  </style>
</head>
<body>

  <h1>Hello, World!</h1>
  <p>This is a simple sample HTML page.</p>

  <button onclick="greet()">Click Me</button>

  <p id="output"></p>

  <script>
    function greet() {
      document.getElementById('output').textContent =
        'Button clicked at ' + new Date().toLocaleTimeString();
    }
  </script>

</body>
</html>
